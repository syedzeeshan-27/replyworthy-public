[project]
name = "replyworthy"
version = "1.0.0"
license = {text = "MIT"}
description = "Open-source AI outreach agent: find local-business leads, score them, write the first email, sort the replies."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.90.0",
    "firecrawl-py>=1.0.0",
    "openpyxl>=3.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "dnspython>=2.6.0",
    "tzdata>=2024.1",
    "imap-tools>=1.7.0",
    "psycopg[binary]>=3.1.0",
    "cryptography>=42.0.0",
]

[tool.setuptools]
# Source lives in config/ and tools/; this repo is run as scripts, not packaged/distributed.
packages = ["config"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

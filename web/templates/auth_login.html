{% extends "auth_base.html" %}
{% block title %}Log in · Replyworthy{% endblock %}
{% block heading %}Log in{% endblock %}
{% block content %}
<form method="post" action="/login" class="auth-form">
  <input type="hidden" name="next" value="{{ next or '/' }}">
  <label>Email
    <input type="email" name="email" value="{{ email or '' }}" required autofocus>
  </label>
  <label>Password
    <input type="password" name="password" required>
  </label>
  <button type="submit">Log in</button>
</form>
{% if unconfirmed %}
<form method="post" action="/resend" class="auth-form">
  <input type="hidden" name="email" value="{{ email or '' }}">
  <button type="submit">Send the confirmation link again</button>
</form>
{% endif %}
{% endblock %}
{% block foot %}
<a href="/forgot">Forgot password?</a> · New here? <a href="/signup">Create an account</a>
{% endblock %}
